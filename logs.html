<!DOCTYPE html>
<html>
<head>
  <title>标签捕手 · 操作日志</title>
  <meta charset="utf-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:#fafafa; color:#1c1c1e; padding:24px; }
    h1 { font-size:18px; margin-bottom:16px; display:flex; align-items:baseline; gap:12px; }
    h1 small { font-size:12px; color:#999; font-weight:400; }
    .toolbar { display:flex; gap:8px; margin-bottom:16px; }
    .toolbar button { padding:8px 16px; border:1px solid #d0d5dd; border-radius:8px;
      background:#fff; cursor:pointer; font-size:13px; }
    .toolbar button:hover { background:#f2f3f5; }
    .toolbar button.danger { color:#e74c3c; }
    #logs { background:#fff; border:1px solid #eef0f3; border-radius:12px;
      padding:16px; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size:12px; line-height:1.9; white-space:pre-wrap; word-break:break-all;
      max-height: calc(100vh - 180px); overflow-y:auto; }
    .empty { color:#bbb; }
  </style>
</head>
<body>
  <h1>📝 操作日志 <small id="count"></small></h1>
  <div class="toolbar">
    <button id="exportTxtBtn">导出 TXT</button>
    <button id="exportJsonBtn">导出 JSON</button>
    <button id="clearBtn" class="danger">清空日志</button>
  </div>
  <div id="logs"></div>
  <script src="logs.js"></script>
</body>
</html>
